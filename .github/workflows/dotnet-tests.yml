name: .NET Tests

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  test:
    name: Build and test Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/CamberGauge.Tests/CamberGauge.Tests.csproj

      - name: Build tests
        run: dotnet build tests/CamberGauge.Tests/CamberGauge.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/CamberGauge.Tests/CamberGauge.Tests.csproj --configuration Release --no-build --verbosity normal